services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: overtone
      POSTGRES_PASSWORD: overtone
      POSTGRES_DB: overtone
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overtone"]
      interval: 5s
      timeout: 5s
      retries: 10
