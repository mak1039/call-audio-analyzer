databases:
  - name: overtone-db
    plan: free
    databaseName: overtone
    user: overtone

services:
  - type: web
    name: overtone
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: overtone-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OVERTONE_USERNAME
        sync: false
      - key: OVERTONE_PASSWORD
        sync: false
      - key: OVERTONE_MAX_UPLOAD_MB
        value: "500"
      - key: OVERTONE_WORKSPACE_ROOT
        value: /tmp/overtone
