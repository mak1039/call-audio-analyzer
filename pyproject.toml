[project]
name = "overtone"
version = "0.1.0"
description = "Emotional tone and background-noise analysis for production call audio"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2"]

[project.scripts]
overtone = "overtone.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.9.2",
    "black>=24.10.0",
    "mypy>=1.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overtone"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
packages = ["overtone"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "overtone.domain.*"
strict = true

[[tool.mypy.overrides]]
module = "overtone.application.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
